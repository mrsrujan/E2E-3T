apiVersion: apps/v1
kind: Deployment
metadata:
  name: yelb-ui
  namespace: three-tier
  labels:
    app: yelb-ui
    tier: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: yelb-ui
  template:
    metadata:
      labels:
        app: yelb-ui
        tier: frontend
    spec:
      containers:
        - name: yelb-ui
          # Image is bumped by Jenkins (see Jenkins-Pipeline-Code/Jenkinsfile-UI).
          # First build pushes :1; until then expect ImagePullBackOff.
          image: 640584914236.dkr.ecr.us-east-1.amazonaws.com/yelb-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20

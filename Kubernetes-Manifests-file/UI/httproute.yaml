# HTTPRoute attached to the yelb-gateway created by terraform/gateway/.
# Yelb-ui's internal nginx proxies /api requests to yelb-appserver — so a
# single route for "/" is enough; no path split is required.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: yelb-ui
  namespace: three-tier
spec:
  parentRefs:
    - name: yelb-gateway
      namespace: three-tier
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: yelb-ui
          port: 80
          weight: 1

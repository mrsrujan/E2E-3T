apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yelb-ui
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/mrsrujan/E2E-3T.git
    targetRevision: main
    path: Kubernetes-Manifests-file/UI
  destination:
    server: https://kubernetes.default.svc
    namespace: three-tier
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
